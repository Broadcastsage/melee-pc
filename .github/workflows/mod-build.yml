name: Modded Windows build (secret characters)

# Builds melee-pc for Windows x86-64 with the secret-characters mod applied
# (Master Hand, Crazy Hand, Giga Bowser, the Wireframes and Sandbag on the
# VS character select screen). The patches were written against upstream
# commit 0fb0af3, so they are applied there: secret-characters.patch first,
# then secret-characters-fixN.patch in order. The finished melee.exe is also
# published as the "latest-mod" release so it can be fetched directly.
on:
  push:
    paths:
      - '.github/workflows/mod-build.yml'
      - '.github/workflows/*.patch'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: Windows x86_64 (modded)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply the mod
        run: |
          mkdir -p "$RUNNER_TEMP/patches"
          cp .github/workflows/*.patch "$RUNNER_TEMP/patches/"
          git checkout --detach 0fb0af3304d3469308b5574369a6ec86f145632f
          git apply --whitespace=nowarn "$RUNNER_TEMP/patches/secret-characters.patch"
          for p in $(ls "$RUNNER_TEMP"/patches/secret-characters-fix*.patch | sort -V); do
            echo "applying $p"
            git apply --whitespace=nowarn "$p"
          done
          git status --short

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build cmake zip cabextract curl mingw-w64
          sudo update-alternatives --set x86_64-w64-mingw32-gcc /usr/bin/x86_64-w64-mingw32-gcc-posix
          sudo update-alternatives --set x86_64-w64-mingw32-g++ /usr/bin/x86_64-w64-mingw32-g++-posix

      - name: Build and package
        env:
          TARGET_ARCH: x86_64
        run: tools/package_windows.sh

      - uses: actions/upload-artifact@v4
        with:
          name: Melee-Windows-x86_64-modded
          path: dist/Melee-Windows-x86_64.zip
          if-no-files-found: error

      - name: Publish melee.exe for direct download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest-mod --yes --cleanup-tag --repo "$GITHUB_REPOSITORY" || true
          gh release create latest-mod build-win/melee.exe dist/Melee-Windows-x86_64.zip \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Latest modded build" --notes "Built by run $GITHUB_RUN_ID"
